<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento cancelado - Madame do Luar</title>
  <link rel="stylesheet" href="../../style.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #100915; color: #fff; }
    .return-panel { width: min(600px, 100%); padding: 32px; border: 1px solid rgba(220, 190, 120, .28); background: rgba(18, 12, 28, .9); border-radius: 8px; text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    .return-panel h1 { margin: 0 0 12px; font-size: 30px; }
    .return-panel p { color: rgba(255,255,255,.78); line-height: 1.6; }
    .return-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
    .return-actions a { text-decoration: none; }
  </style>
</head>
<body>
  <main class="return-panel">
    <h1>Pagamento cancelado</h1>
    <p>Nenhum acesso foi liberado e nenhum credito foi consumido. Se o Mercado Pago ainda mostrar uma tentativa pendente, ela so libera acesso depois de confirmacao segura por webhook.</p>
    <div class="return-actions">
      <a class="btn btn-primary" href="/#planos">Escolher plano</a>
      <a class="btn btn-outline" href="/#perfil">Ver meu perfil</a>
      <a class="btn btn-outline" href="/">Voltar ao portal</a>
    </div>
  </main>
</body>
</html>
